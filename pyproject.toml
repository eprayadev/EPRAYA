[project]
name = "epraya"
version = "0.1.40.1802"
description = "Python package for EPR simulation"
authors = [
    {name = "Epraya developers"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy (<2.5)",
    "scipy (>=1.12.0)",      
    "matplotlib (>=3.8.0)",  
    "ipywidgets (>=7.7.0)", 
    "ipython (>=7.34.0)", 
    "pandas (>=2.2.0)",  
    "jax (>=0.4.0)",
    "chex (>=0.1.80)",
    "optax (>=0.2.0)",
    "jaxlib (>=0.4.0)",
    "numba (>=0.58.0)",
    "joblib (>=1.3.0)",
    "threadpoolctl (>=3.0.0)",
    "plotly (>=5.18.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = ["epraya/STRONG PITCH.dat", "epraya/nucleardaat.txt"]
readme = "Pypireadme.md"
